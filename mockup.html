<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monolith — Daily Habit Tracker</title>
<style>
  :root {
    color-scheme: dark;
    --page:        #0a0a0b;
    --surface:     #101012;
    --surface-2:   #16161a;
    --ink:         #f4f4f5;
    --ink-2:       #a1a1aa;
    --ink-muted:   #63636b;
    --hairline:    rgba(255,255,255,0.08);
    --hairline-2:  rgba(255,255,255,0.16);
    --grid-line:   #232327;

    /* week bands — validated on dark surface */
    --w1: #1d9cb8;
    --w2: #2ba447;
    --w3: #a06fe6;
    --w4: #2057c9;
    --w5: #7d8ce0;

    --check-bg:    #e8e8ea;
    --check-ink:   #0a0a0b;

    --cell: 27px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.4;
    padding: 24px;
  }

  .app { max-width: 1560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 4px 12px;
    border-bottom: 1px solid var(--hairline);
  }
  .wordmark { display: flex; align-items: center; gap: 12px; }
  .wordmark .moai { font-size: 26px; }
  .wordmark h1 { font-size: 19px; font-weight: 700; letter-spacing: 0.16em; }
  .wordmark span.tag { font-size: 12px; color: var(--ink-muted); letter-spacing: 0.02em; margin-top: 2px; display: block; font-weight: 400; }

  .month-nav { display: flex; align-items: center; gap: 10px; }
  .month-nav button {
    background: var(--surface-2); border: 1px solid var(--hairline-2); color: var(--ink-2);
    width: 30px; height: 30px; border-radius: 8px; font-size: 15px; cursor: pointer;
  }
  .month-nav .current { font-size: 15px; font-weight: 600; letter-spacing: 0.06em; min-width: 130px; text-align: center; }

  /* ---------- cards ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding: 18px 20px;
  }
  .card h2 {
    font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-2); margin-bottom: 14px;
  }

  /* ---------- top row ---------- */
  .top-row { display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
  @media (max-width: 900px) { .top-row { grid-template-columns: 1fr; } }

  .chart-wrap { position: relative; }
  .chart-wrap svg { display: block; width: 100%; height: auto; }

  .gauge-card { display: flex; flex-direction: column; }
  .gauge-body { flex: 1; display: flex; align-items: center; gap: 20px; }
  .gauge-num { font-size: 42px; font-weight: 700; line-height: 1; }
  .gauge-sub { font-size: 12px; color: var(--ink-muted); margin-top: 6px; }

  /* ---------- routines grid ---------- */
  .scroll-x { overflow-x: auto; }

  table.routines { border-collapse: collapse; white-space: nowrap; }
  table.routines th, table.routines td { padding: 0; text-align: center; font-weight: 400; }

  .rt-name {
    text-align: left !important; padding: 0 14px 0 4px !important;
    font-size: 13px; min-width: 190px; position: sticky; left: 0; background: var(--surface); z-index: 2;
  }
  .rt-goal {
    font-size: 11px; color: var(--ink-2); min-width: 52px; padding: 0 10px !important;
    font-variant-numeric: tabular-nums;
  }

  th.week-band {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em; color: #fff;
    padding: 4px 0 3px !important; border-radius: 6px 6px 0 0;
  }
  th.week-gap { min-width: 8px; }

  .day-head { font-size: 10px; color: var(--ink-2); padding: 5px 0 1px !important; }
  .day-num  { font-size: 10.5px; color: var(--ink-muted); padding-bottom: 6px !important; font-variant-numeric: tabular-nums; }
  .day-head.today, .day-num.today { color: var(--ink); font-weight: 700; }

  td.cb-cell { width: var(--cell); height: var(--cell); }
  .cb {
    width: 17px; height: 17px; margin: 0 auto; border-radius: 4px;
    border: 1.5px solid var(--hairline-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--check-ink); font-weight: 700;
  }
  .cb.checked { background: var(--check-bg); border-color: var(--check-bg); }
  .cb.future  { border-color: var(--hairline); opacity: 0.45; }
  .cb.spill   { opacity: 0.55; }
  .cb.spill.checked { background: #6e6e76; border-color: #6e6e76; }
  .mon-tag { font-size: 9px; font-weight: 700 !important; letter-spacing: 0.08em; color: var(--ink-muted); padding: 4px 0 0 !important; }
  .day-head.spill, .day-num.spill { color: var(--ink-muted); }
  tr.habit-row:hover td { background: rgba(255,255,255,0.03); }
  tr.habit-row .rt-name:hover { background: var(--surface-2); }

  .stat-head { font-size: 10px; font-weight: 700 !important; letter-spacing: 0.1em; color: var(--ink-muted); padding: 0 8px 6px !important; }
  .stat-cell { font-size: 12px; color: var(--ink-2); padding: 0 8px !important; font-variant-numeric: tabular-nums; }
  .stat-pct  { color: var(--ink); font-weight: 600; }
  td.stat-bar-cell { padding: 0 4px 0 8px !important; min-width: 90px; }
  .stat-bar { height: 7px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .stat-bar i { display: block; height: 100%; border-radius: 4px; background: #3aa6c2; }

  /* ---------- overview / analysis ---------- */
  table.analysis { border-collapse: collapse; white-space: nowrap; }
  table.analysis td, table.analysis th { padding: 0; text-align: center; font-weight: 400; }
  table.analysis .day-head, table.analysis .day-num, table.analysis .an-num, table.analysis .an-bar-cell { min-width: var(--cell); }
  .an-label {
    text-align: left !important; font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-muted); min-width: 190px; padding: 0 14px 0 4px !important;
    position: sticky; left: 0; background: var(--surface); z-index: 2;
  }
  td.an-bar-cell { height: 78px; vertical-align: bottom; }
  .an-bar { width: 13px; margin: 0 auto; border-radius: 4px 4px 0 0; }
  .an-num { font-size: 10.5px; color: var(--ink-2); padding: 3px 0 !important; font-variant-numeric: tabular-nums; border-top: 1px solid var(--hairline); }
  .an-num.dim { color: var(--ink-muted); }
  .wk-cell { padding: 6px 6px 2px !important; border-top: 1px solid var(--hairline); }
  .wk-frac { font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .wk-pct  { font-size: 13px; font-weight: 700; margin-top: 1px; }
  .wk-bar  { height: 7px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin-top: 5px; }
  .wk-bar i { display: block; height: 100%; border-radius: 4px; }

  /* ---------- bottom row ---------- */
  .bottom-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .bottom-row { grid-template-columns: 1fr; } }

  .lb-row { display: flex; align-items: center; gap: 12px; padding: 7px 2px; border-bottom: 1px solid var(--hairline); }
  .lb-row:last-child { border-bottom: none; }
  .lb-rank { width: 22px; font-size: 12px; color: var(--ink-muted); font-variant-numeric: tabular-nums; text-align: right; }
  .lb-name { flex: 0 0 200px; font-size: 13px; }
  .lb-bar { flex: 1; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .lb-bar i { display: block; height: 100%; border-radius: 4px; background: #3aa6c2; }
  .lb-pct { width: 48px; text-align: right; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }

  .streak-row { display: flex; align-items: center; gap: 12px; padding: 7px 2px; border-bottom: 1px solid var(--hairline); }
  .streak-row:last-child { border-bottom: none; }
  .streak-name { flex: 0 0 200px; font-size: 13px; }
  .streak-days { display: flex; gap: 3px; flex: 1; }
  .streak-dot { width: 9px; height: 9px; border-radius: 3px; background: var(--surface-2); }
  .streak-dot.on { background: #3aa6c2; }
  .streak-count { width: 70px; text-align: right; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .streak-count b { color: var(--ink); font-size: 13px; }

  /* ---------- footer month tabs ---------- */
  .month-tabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px; }
  .month-tab {
    font-size: 12px; color: var(--ink-2); padding: 6px 14px; border-radius: 8px;
    border: 1px solid var(--hairline); background: var(--surface); cursor: pointer;
  }
  .month-tab.active { background: var(--check-bg); color: var(--check-ink); font-weight: 600; border-color: var(--check-bg); }
  .month-tab.dashboard { border-color: var(--hairline-2); letter-spacing: 0.04em; }

  /* ---------- tooltip ---------- */
  #tip {
    position: fixed; pointer-events: none; z-index: 10; display: none;
    background: #1d1d22; border: 1px solid var(--hairline-2); border-radius: 8px;
    padding: 6px 10px; font-size: 12px; color: var(--ink);
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  #tip .t-sub { color: var(--ink-2); font-size: 11px; }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="wordmark">
      <div class="moai">🗿</div>
      <div>
        <h1>MONOLITH</h1>
        <span class="tag">daily habit tracker</span>
      </div>
    </div>
    <div class="month-nav"><div class="current">JULY 2026</div></div>
  </header>

  <section class="month-tabs">
    <div class="month-tab dashboard">YEAR DASHBOARD</div>
  </section>

  <section class="top-row">
    <div class="card">
      <h2>Monthly Overview — daily completion</h2>
      <div class="chart-wrap"><svg id="areaChart" viewBox="0 0 1000 220" role="img" aria-label="Daily completion percentage for July"></svg></div>
    </div>
    <div class="card gauge-card">
      <h2>Month Progress</h2>
      <div class="gauge-body">
        <svg id="gauge" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Overall month progress"></svg>
        <div>
          <div class="gauge-num" id="gaugeNum">—</div>
          <div class="gauge-sub" id="gaugeSub">of monthly goal</div>
        </div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>Daily Routines</h2>
    <div class="scroll-x"><table class="routines" id="routinesTable"></table></div>
  </section>

  <section class="card">
    <h2>Overview — Analysis</h2>
    <div class="scroll-x"><table class="analysis" id="analysisTable"></table></div>
  </section>

  <section class="bottom-row">
    <div class="card">
      <h2>Top 10 Daily Habits</h2>
      <div id="leaderboard"></div>
    </div>
    <div class="card">
      <h2>Current Streaks — last 14 days</h2>
      <div id="streaks"></div>
    </div>
  </section>

</div>

<div id="tip"></div>

<script>
/* =====================================================================
   MOCK DATA — deterministic, so the mockup always renders identically.
   July 2026: 31 days, July 1 is a Wednesday, "today" is July 24.
   ===================================================================== */
const DAYS = 31;                      // days in July
const TODAY = 24;                     // July 24
const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WEEK_COLORS = ['var(--w1)','var(--w2)','var(--w3)','var(--w4)','var(--w5)'];
const WEEK_HEX    = ['#1d9cb8','#2ba447','#a06fe6','#2057c9','#7d8ce0'];
const MONTH_FULL  = { JUN: 'June', JUL: 'July', AUG: 'August' };

/* Timeline aligned to real calendar weeks — every week starts Sunday.
   July 2026 starts on a Wednesday, so the view leads in with Jun 28–30 and
   tails out with Aug 1 → five full Sun–Sat weeks, no partial bands.
   Spillover days count toward weekly progress but never monthly stats. */
const TL = [];
for (let d = 28; d <= 30; d++) TL.push({ n: d, mon: 'JUN', inMonth: false });
for (let d = 1;  d <= 31; d++) TL.push({ n: d, mon: 'JUL', inMonth: true  });
TL.push({ n: 1, mon: 'AUG', inMonth: false });
TL.forEach((t, i) => { t.wd = WEEKDAYS[i % 7]; });        // Jun 28 2026 = Sunday
const JULY_OFFSET = 3;                                    // TL index of July 1
const TODAY_I = JULY_OFFSET + TODAY - 1;                  // TL index of today

/* weeks are full Sun–Sat chunks of the timeline */
const WEEKS = [];
for (let s = 0; s < TL.length; s += 7) WEEKS.push({ start: s, end: s + 6 });

/* habit: name, emoji, weekly target (days per week — the variable goal) , base success rate for mock data */
const HABITS = [
  { name: 'Wake up early',      emoji: '⏰', perWeek: 7, p: 0.92 },
  { name: 'Time with God',      emoji: '🙏', perWeek: 7, p: 0.99 },
  { name: 'Deep Work',          emoji: '💻', perWeek: 5, p: 0.95 },
  { name: 'No Alcohol',         emoji: '🍷', perWeek: 7, p: 0.88 },
  { name: 'Cold Shower',        emoji: '🚿', perWeek: 6, p: 0.86 },
  { name: 'No Porn',            emoji: '🚫', perWeek: 7, p: 0.85 },
  { name: 'Gym',                emoji: '🏋️', perWeek: 4, p: 0.80 },
  { name: 'Budget tracking',    emoji: '💰', perWeek: 3, p: 0.78 },
  { name: 'Goal tracking',      emoji: '📋', perWeek: 3, p: 0.74 },
  { name: 'Reading/Meditating', emoji: '📖', perWeek: 5, p: 0.66 },
];

/* seeded PRNG so the mock grid is stable run-to-run */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(1337);

/* checks[h][d] : d is 0-based timeline index */
const checks = HABITS.map(h => {
  return Array.from({ length: TL.length }, (_, d) => {
    if (d > TODAY_I) return false;                   // future days
    return rand() < h.p * (h.perWeek / 7);           // respect the weekly target
  });
});

/* ---------- derived stats (monthly stats = July days only) ---------- */
const monthGoal = h => Math.round(h.perWeek / 7 * DAYS);          // variable goal → month target
const doneFor   = i => checks[i].reduce((n, on, d) => n + (on && TL[d].inMonth ? 1 : 0), 0);
const expectedToDate = h => Math.min(monthGoal(h), Math.round(h.perWeek / 7 * TODAY));

const tlDone = TL.map((_, d) => checks.reduce((n, row) => n + (row[d] ? 1 : 0), 0));
const dailyDone = TL.filter(t => t.inMonth).map((_, d) => tlDone[JULY_OFFSET + d]);   // July only
const dailyGoal = HABITS.length;

const totalGoal = HABITS.reduce((n, h) => n + monthGoal(h), 0);
const totalDone = HABITS.reduce((n, _, i) => n + doneFor(i), 0);

const weekday = d => TL[JULY_OFFSET + d].wd;                      // d = 0-based July day

/* ---------- tooltip ---------- */
const tip = document.getElementById('tip');
function showTip(html, x, y) {
  tip.innerHTML = html;
  tip.style.display = 'block';
  tip.style.left = Math.min(x + 14, window.innerWidth - 160) + 'px';
  tip.style.top = (y + 16) + 'px';
}
function hideTip() { tip.style.display = 'none'; }

/* =====================================================================
   AREA CHART — daily completion % through today
   ===================================================================== */
(function areaChart() {
  const svg = document.getElementById('areaChart');
  const W = 1000, H = 220, padL = 44, padR = 14, padT = 12, padB = 26;
  const iw = W - padL - padR, ih = H - padT - padB;
  const x = d => padL + (d / (DAYS - 1)) * iw;
  const y = v => padT + (1 - v) * ih;

  let g = '';
  /* gridlines + y labels */
  [0, 0.25, 0.5, 0.75, 1].forEach(v => {
    g += `<line x1="${padL}" y1="${y(v)}" x2="${W - padR}" y2="${y(v)}" stroke="var(--grid-line)" stroke-width="1"/>`;
    g += `<text x="${padL - 8}" y="${y(v) + 3.5}" text-anchor="end" font-size="10" fill="var(--ink-muted)">${v * 100}%</text>`;
  });
  /* x labels every 5 days */
  for (let d = 0; d < DAYS; d += 1) {
    if ((d + 1) % 5 === 0 || d === 0) {
      g += `<text x="${x(d)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--ink-muted)">${d + 1}</text>`;
    }
  }

  const pts = [];
  for (let d = 0; d < TODAY; d++) pts.push([x(d), y(dailyDone[d] / dailyGoal)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L ${pts[pts.length - 1][0].toFixed(1)} ${y(0)} L ${pts[0][0].toFixed(1)} ${y(0)} Z`;

  g += `<path d="${area}" fill="var(--w1)" opacity="0.13"/>`;
  g += `<path d="${line}" fill="none" stroke="var(--w1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  /* end marker: today */
  const last = pts[pts.length - 1];
  g += `<circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="var(--w1)" stroke="var(--page)" stroke-width="2"/>`;
  g += `<text x="${last[0] + 8}" y="${last[1] - 8}" font-size="11" font-weight="600" fill="var(--ink)">${Math.round(dailyDone[TODAY - 1] / dailyGoal * 100)}%</text>`;

  /* hover hit zones */
  for (let d = 0; d < TODAY; d++) {
    g += `<rect x="${x(d) - iw / DAYS / 2}" y="${padT}" width="${iw / DAYS}" height="${ih}" fill="transparent"
           data-d="${d}" class="hit"/>`;
  }
  svg.innerHTML = g;

  svg.querySelectorAll('.hit').forEach(r => {
    r.addEventListener('mousemove', e => {
      const d = +r.dataset.d;
      showTip(`<b>${weekday(d)} July ${d + 1}</b><div class="t-sub">${dailyDone[d]} of ${dailyGoal} habits · ${Math.round(dailyDone[d] / dailyGoal * 100)}%</div>`, e.clientX, e.clientY);
    });
    r.addEventListener('mouseleave', hideTip);
  });
})();

/* =====================================================================
   GAUGE — overall month progress donut
   ===================================================================== */
(function gauge() {
  const pct = totalDone / totalGoal;
  const svg = document.getElementById('gauge');
  const r = 48, c = 2 * Math.PI * r;
  svg.innerHTML = `
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="11"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--w1)" stroke-width="11"
      stroke-linecap="round" stroke-dasharray="${(pct * c).toFixed(1)} ${c.toFixed(1)}"
      transform="rotate(-90 60 60)"/>
    <text x="60" y="66" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink)">${Math.round(pct * 100)}%</text>`;
  document.getElementById('gaugeNum').textContent = `${totalDone}/${totalGoal}`;
  document.getElementById('gaugeSub').textContent = `checks toward July goal · day ${TODAY} of ${DAYS}`;
})();

/* =====================================================================
   ROUTINES GRID
   ===================================================================== */
(function routines() {
  const t = document.getElementById('routinesTable');
  let html = '';
  const gapH = i => (i < WEEKS.length - 1 ? '<th class="week-gap"></th>' : '');

  /* week band row */
  html += '<tr><th class="rt-name"></th><th class="rt-goal"></th>';
  WEEKS.forEach((w, i) => {
    html += `<th class="week-band" colspan="7" style="background:${WEEK_COLORS[i]}">WEEK ${i + 1}</th>${gapH(i)}`;
  });
  html += '<th class="week-gap"></th><th colspan="4"></th></tr>';

  /* month row — tags only where spillover months appear */
  html += '<tr><th class="rt-name"></th><th class="rt-goal"></th>';
  WEEKS.forEach((w, i) => {
    let d = w.start;
    while (d <= w.end) {
      const mon = TL[d].mon;
      let span = 0;
      while (d + span <= w.end && TL[d + span].mon === mon) span++;
      html += `<th class="mon-tag" colspan="${span}">${mon === 'JUL' ? '' : mon}</th>`;
      d += span;
    }
    html += gapH(i);
  });
  html += '<th class="week-gap"></th><th colspan="4"></th></tr>';

  /* weekday row */
  html += '<tr><th class="rt-name"></th><th class="rt-goal" style="font-size:10px;color:var(--ink-muted)">GOAL</th>';
  WEEKS.forEach((w, i) => {
    for (let d = w.start; d <= w.end; d++) {
      html += `<th class="day-head${d === TODAY_I ? ' today' : ''}${TL[d].inMonth ? '' : ' spill'}">${TL[d].wd}</th>`;
    }
    html += gapH(i);
  });
  html += '<th class="week-gap"></th><th class="stat-head">DONE</th><th class="stat-head">OPEN</th><th class="stat-head">%</th><th class="stat-head" style="text-align:left">PROGRESS</th></tr>';

  /* day number row */
  html += '<tr><th class="rt-name"></th><th class="rt-goal"></th>';
  WEEKS.forEach((w, i) => {
    for (let d = w.start; d <= w.end; d++) {
      html += `<th class="day-num${d === TODAY_I ? ' today' : ''}${TL[d].inMonth ? '' : ' spill'}">${TL[d].n}</th>`;
    }
    html += gapH(i);
  });
  html += '<th class="week-gap"></th><th colspan="4"></th></tr>';

  /* habit rows */
  HABITS.forEach((h, i) => {
    const done = doneFor(i), goal = monthGoal(h);
    const open = Math.max(0, goal - done);
    const pct = Math.min(100, Math.round(done / goal * 100));
    html += `<tr class="habit-row"><td class="rt-name">${h.name} ${h.emoji}</td><td class="rt-goal">${h.perWeek}×/wk</td>`;
    WEEKS.forEach((w, wi) => {
      for (let d = w.start; d <= w.end; d++) {
        const on = checks[i][d];
        const future = d > TODAY_I;
        const spill = !TL[d].inMonth;
        html += `<td class="cb-cell"><div class="cb${on ? ' checked' : ''}${future ? ' future' : ''}${spill ? ' spill' : ''}">${on ? '✓' : ''}</div></td>`;
      }
      if (wi < WEEKS.length - 1) html += '<td class="week-gap"></td>';
    });
    html += `<td class="week-gap"></td>
      <td class="stat-cell">${done}</td>
      <td class="stat-cell">${open}</td>
      <td class="stat-cell stat-pct">${pct}%</td>
      <td class="stat-bar-cell"><div class="stat-bar"><i style="width:${pct}%"></i></div></td></tr>`;
  });

  t.innerHTML = html;
})();

/* =====================================================================
   ANALYSIS — daily bars, done/goal/open, weekly rollups
   ===================================================================== */
(function analysis() {
  const t = document.getElementById('analysisTable');
  let html = '';
  const gap = i => (i < WEEKS.length - 1 ? '<td class="week-gap"></td>' : '');
  const gapH = i => (i < WEEKS.length - 1 ? '<th class="week-gap"></th>' : '');

  /* band + month + weekday + day rows */
  html += '<tr><th class="an-label"></th>';
  WEEKS.forEach((w, i) => {
    html += `<th class="week-band" colspan="7" style="background:${WEEK_COLORS[i]}">WEEK ${i + 1}</th>${gapH(i)}`;
  });
  html += '</tr>';

  html += '<tr><th class="an-label"></th>';
  WEEKS.forEach((w, i) => {
    let d = w.start;
    while (d <= w.end) {
      const mon = TL[d].mon;
      let span = 0;
      while (d + span <= w.end && TL[d + span].mon === mon) span++;
      html += `<th class="mon-tag" colspan="${span}">${mon === 'JUL' ? '' : mon}</th>`;
      d += span;
    }
    html += gapH(i);
  });
  html += '</tr>';

  html += '<tr><th class="an-label"></th>';
  WEEKS.forEach((w, i) => {
    for (let d = w.start; d <= w.end; d++) html += `<th class="day-head${d === TODAY_I ? ' today' : ''}${TL[d].inMonth ? '' : ' spill'}">${TL[d].wd}</th>`;
    html += gapH(i);
  });
  html += '</tr>';

  html += '<tr><th class="an-label"></th>';
  WEEKS.forEach((w, i) => {
    for (let d = w.start; d <= w.end; d++) html += `<th class="day-num${d === TODAY_I ? ' today' : ''}${TL[d].inMonth ? '' : ' spill'}">${TL[d].n}</th>`;
    html += gapH(i);
  });
  html += '</tr>';

  /* bars — spillover days render dimmed */
  html += '<tr><td class="an-label">Analysis</td>';
  WEEKS.forEach((w, i) => {
    for (let d = w.start; d <= w.end; d++) {
      const v = tlDone[d];
      const hpx = Math.round(v / dailyGoal * 72);
      const op = TL[d].inMonth ? 1 : 0.45;
      html += `<td class="an-bar-cell" data-d="${d}">${v ? `<div class="an-bar" style="height:${hpx}px;background:${WEEK_COLORS[i]};opacity:${op}"></div>` : ''}</td>`;
    }
    html += gap(i);
  });
  html += '</tr>';

  /* done / goal / open */
  const rows = [
    { label: 'Done', fn: d => tlDone[d], dim: false },
    { label: 'Goal', fn: d => dailyGoal, dim: true },
    { label: 'Open', fn: d => Math.max(0, dailyGoal - tlDone[d]), dim: true },
  ];
  rows.forEach(r => {
    html += `<tr><td class="an-label">${r.label}</td>`;
    WEEKS.forEach((w, i) => {
      for (let d = w.start; d <= w.end; d++) {
        html += `<td class="an-num${r.dim || !TL[d].inMonth ? ' dim' : ''}">${r.fn(d)}</td>`;
      }
      html += gap(i);
    });
    html += '</tr>';
  });

  /* weekly progress — full Sun–Sat weeks, spillover days included */
  html += '<tr><td class="an-label">Weekly progress</td>';
  WEEKS.forEach((w, i) => {
    const wkGoal = 7 * dailyGoal;
    let wkDone = 0;
    for (let d = w.start; d <= w.end; d++) wkDone += tlDone[d];
    const pct = Math.round(wkDone / wkGoal * 100);
    html += `<td class="wk-cell" colspan="7">
      <span class="wk-frac">${wkDone}/${wkGoal}</span>
      <span class="wk-pct" style="margin-left:8px">${pct}%</span>
      <div class="wk-bar"><i style="width:${pct}%;background:${WEEK_COLORS[i]}"></i></div>
    </td>${gap(i)}`;
  });
  html += '</tr>';

  t.innerHTML = html;

  t.querySelectorAll('.an-bar-cell').forEach(td => {
    td.addEventListener('mousemove', e => {
      const d = +td.dataset.d;
      showTip(`<b>${TL[d].wd} ${MONTH_FULL[TL[d].mon]} ${TL[d].n}</b><div class="t-sub">${tlDone[d]} done · ${Math.max(0, dailyGoal - tlDone[d])} open</div>`, e.clientX, e.clientY);
    });
    td.addEventListener('mouseleave', hideTip);
  });
})();

/* =====================================================================
   LEADERBOARD — % of expected-to-date, ranked
   ===================================================================== */
(function leaderboard() {
  const rows = HABITS.map((h, i) => {
    const exp = expectedToDate(h);
    const pct = Math.min(100, Math.round(doneFor(i) / Math.max(1, exp) * 100));
    return { h, pct };
  }).sort((a, b) => b.pct - a.pct);

  document.getElementById('leaderboard').innerHTML = rows.map((r, i) => `
    <div class="lb-row">
      <div class="lb-rank">${i + 1}</div>
      <div class="lb-name">${r.h.name} ${r.h.emoji}</div>
      <div class="lb-bar"><i style="width:${r.pct}%"></i></div>
      <div class="lb-pct">${r.pct}%</div>
    </div>`).join('');
})();

/* =====================================================================
   STREAKS — last 14 days per habit, current streak count
   ===================================================================== */
(function streaks() {
  const rows = HABITS.map((h, i) => {
    let streak = 0;
    for (let d = TODAY_I; d >= 0 && checks[i][d]; d--) streak++;
    const window14 = checks[i].slice(TODAY_I - 13, TODAY_I + 1);
    return { h, streak, window14 };
  }).sort((a, b) => b.streak - a.streak);

  document.getElementById('streaks').innerHTML = rows.map(r => `
    <div class="streak-row">
      <div class="streak-name">${r.h.name} ${r.h.emoji}</div>
      <div class="streak-days">${r.window14.map(on => `<div class="streak-dot${on ? ' on' : ''}"></div>`).join('')}</div>
      <div class="streak-count"><b>${r.streak}</b> day${r.streak === 1 ? '' : 's'}</div>
    </div>`).join('');
})();

/* =====================================================================
   MONTH TABS
   ===================================================================== */
(function tabs() {
  const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const wrap = document.querySelector('.month-tabs');
  months.forEach((m, i) => {
    const el = document.createElement('div');
    el.className = 'month-tab' + (i === 6 ? ' active' : '');
    el.textContent = m;
    wrap.appendChild(el);
  });
})();
</script>
</body>
